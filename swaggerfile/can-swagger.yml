openapi: "3.0.2"
info:
  title: Corporate Action API
  version: "1.0.2"
servers:
  - url: https://rzbtomt01.at.rzb.rbg.cc/cantest/
paths:
  /corporateActions/canspa:
    get:
      tags:
        - Corporate Action
      summary: Finds Corporate Actions by criteria
      description: Search by corporate action criteria
      operationId: findCanspa
      parameters:
        - $ref: './shared-resources/common-isins.yaml#/components/parameters/isinInQueryWithMaxLength'
        - $ref: '#/components/parameters/spaCanstat'
        - $ref: '#/components/parameters/spaStatus'
        - $ref: './shared-resources/common.yaml#/components/parameters/sort'
        - $ref: './shared-resources/common.yaml#/components/parameters/order'
        - $ref: './shared-resources/common.yaml#/components/parameters/page'
        - $ref: './shared-resources/common.yaml#/components/parameters/pageSize'
        - name: canTypeId
          in: query
          example: 36
          description: Can event typ id (svzcantyp)
          schema:
            type: integer
            format: int64
        - name: zspaIds
          in: query
          example: AT00007430163806, UK00007430164432
          description: List of Corporate action identifications
          schema:
            type: array
            items:
              type: integer
              format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanspaPage'
        '400':
          description: Invalid status value
      security:
        - can_auth:
            - 'CAN-CA_V'
            - 'CAN-CA_E'
  /corporateActions/search:
    get:
      tags:
        - Corporate Action
      summary: Finds Corporate Actions by criteria
      description: Search by corporate action criteria
      operationId: findByCaCriteria
      parameters:
        - $ref: './shared-resources/common-isins.yaml#/components/parameters/isinInQueryWithMaxLength'
        - $ref: './shared-resources/common.yaml#/components/parameters/corpRef'
        - $ref: '#/components/parameters/zspaStatus'
        - $ref: '#/components/parameters/zspaWfStatus'
        - $ref: '#/components/parameters/spaCanstat'
        - $ref: '#/components/parameters/spaStatus'
        - $ref: '#/components/parameters/caFromDate'
        - $ref: '#/components/parameters/caToDate'
        - $ref: '#/components/parameters/canSpaAttrs'
        - $ref: './shared-resources/common.yaml#/components/parameters/sort'
        - $ref: './shared-resources/common.yaml#/components/parameters/order'
        - $ref: './shared-resources/common.yaml#/components/parameters/page'
        - $ref: './shared-resources/common.yaml#/components/parameters/pageSize'
        - $ref: './shared-resources/common.yaml#/components/parameters/cantypCaevIds'
        - name: coaf
          in: query
          example: YY17121YY
          description: Coaf
          schema:
            type: string
        - name: dateselection
          in: query
          example: 2017-07-21
          description: Can event spa date - creation date of the event
          schema:
            type: string
            enum:
              - spa_date
              - rddt_date
              - RDDT
            x-enum-varnames:
              - spa_date
              - rddt_date
              - RDDT
        - name: rddtFromDate
          in: query
          example: 2017-07-21
          description: RDDT date
          schema:
            type: string
            format: date
        - name: rddtToDate
          in: query
          example: 2017-07-21
          description: Record date
          schema:
            type: string
            format: date
        - name: recordDateFromDate
          in: query
          example: 2017-07-21
          description: Record date
          schema:
            type: string
            format: date
        - name: recordDateToDate
          in: query
          schema:
            type: string
            format: date
        - name: advToDate
          in: query
          example: 2017-07-21
          description: Advice date
          schema:
            type: string
            format: date
        - name: advFromDate
          in: query
          example: 2017-07-21
          description: Advice date
          schema:
            type: string
            format: date
        - name: areAgentDisclosures
          in: query
          example: true
          description: Flag to load agent disclosures by non swift attribute email != null
          schema:
            type: boolean
        - $ref: '#/components/parameters/nsdResponseStatus'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorporateActionResultPage'
        '400':
          description: Invalid status value
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActions/search-with-pos:
    post:
      tags:
        - GIG API Corporate Actions with positions
      summary: Finds Corporate Actions by criteria with additional data for GIG
      description: Search by corporate action criteria
      operationId: findByCaCriteriaWithPos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GIGParamsInBody'
      responses:
        '200':
          description: successful operation - list of caevs with positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchCanInstanceResultWithPos'
        '400':
          description: Invalid status value
      security:
        - can_auth:
            - 'CAN-CA_V'
            - 'GIG_API'
  /corporateActionsHolidays/holidays:
    get:
      tags:
        - canHoliday
      operationId: getHolidays
      description: Fetch Holidays for non processing days
      parameters:
        - $ref: './shared-resources/common.yaml#/components/parameters/sort'
        - $ref: './shared-resources/common.yaml#/components/parameters/order'
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 'A collection of Holidays'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Holiday'
      security:
        - can_auth:
            - 'CAN-WAC_V'
    put:
      tags:
        - canHoliday
      description: Update Holiday
      operationId: updateHoliday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Holiday'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Holiday'
      security:
        - can_auth:
            - 'CAN-WAC_E'
    post:
      tags:
        - canHoliday
      description: Create Holiday
      operationId: createHoliday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Holiday'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Holiday'
      security:
        - can_auth:
            - 'CAN-WAC_E'
    delete:
      tags:
        - canHoliday
      operationId: deleteHoliday
      description: Delete Holiday from db
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 'Successfully deleted'
      security:
        - can_auth:
          - 'CAN-WAC_E'
  /corporateActions/corporate-action-details:
    get:
      tags:
        - GIG API Corporate Actions details
      summary: Find Corporate Action details for GIG
      description: Get Corporate Action Details by PosId
      operationId: getCorporateActionDetailsForGIG
      parameters:
        - name: posId
          in: query
          description: Position Id
          required: true
          schema:
            type: integer
            format: int64
        - name: src
          in: query
          description: pos/wpos
          required: true
          schema:
            type: string
        - name: language
          in: query
          required: true
          description: Language for the details
          example: EN
          schema:
            $ref: './shared-resources/common.yaml#/components/schemas/LanguageType'
      responses:
        '200':
          description: successful operation - details for a corporate action
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CorporateActionDetailsForGIG'
        '400':
          description: Invalid parameters
      security:
        - can_auth:
            - 'CAN-CA_V'
            - 'GIG_API'
  /corporateActions/searchNsdTaxDisclosure:
    get:
      tags:
        - Nsd Disclosure
      summary: Finds Corporate Actions by criteria
      description: Search by corporate action criteria
      operationId: findTaxDisclosureByCriteria
      parameters:
        - $ref: './shared-resources/common-isins.yaml#/components/parameters/isinInQueryWithMaxLength'
        - $ref: '#/components/parameters/zspaStatus'
        - $ref: '#/components/parameters/spaCanstat'
        - $ref: '#/components/parameters/spaStatus'
        - $ref: '#/components/parameters/caFromDate'
        - $ref: '#/components/parameters/caToDate'
        - $ref: '#/components/parameters/canSpaAttrs'
        - $ref: './shared-resources/common.yaml#/components/parameters/sort'
        - $ref: './shared-resources/common.yaml#/components/parameters/order'
        - $ref: './shared-resources/common.yaml#/components/parameters/page'
        - $ref: './shared-resources/common.yaml#/components/parameters/pageSize'
        - name: dateselection
          in: query
          example: 2017-07-21
          description: Can event spa date - creation date of the event
          schema:
            type: string
            enum:
              - spa_date
              - rddt_date
              - RDTE
            x-enum-varnames:
              - spa_date
              - rddt_date
              - RDDT
        - name: rdteFromDate
          in: query
          example: 2017-07-21
          description: RDTE date
          schema:
            type: string
            format: date
        - name: rdteToDate
          in: query
          example: 2017-07-21
          description: RDTE date
          schema:
            type: string
            format: date
        - name: advToDate
          in: query
          example: 2017-07-21
          description: Advice date
          schema:
            type: string
            format: date
        - name: advFromDate
          in: query
          example: 2017-07-21
          description: Advice date
          schema:
            type: string
            format: date
        - name: nsdDisclosureEventStatus
          in: query
          example: 2017-07-21
          description: >-
            CLOSED - if all lagerstellen defined in the can event have processed disclosure with status CLOSED
            OPEN - if there exists at least one lagerstelle linked to the can event which has unprocessed disclosure
          schema:
            type: string
            enum:
              - OPEN
              - CLOSED
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorporateActionResultTaxPage'
        '400':
          description: Invalid status value
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActions/checkIsinInGdp/{isin}:
    get:
      tags:
        - GDP
      summary: Validate isin with GDP
      description: Search by corporate action criteria
      operationId: checkIsinInGdp
      parameters:
        - $ref: './shared-resources/common-isins.yaml#/components/parameters/isinInPathRequiredWithPattern'
      responses:
        '200':
          description: returns fivfi id of the isin, is was found in the GDP
          content:
            text/plain:
              schema:
                type: string
        '204':
          description: isin not found in the database no string will be returned
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Invalid isin
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActions/checkIsinsInGdp/{isins}:
    get:
      tags:
        - GDP
      summary: Validate isins list with GDP
      description: Validate a list of isins
      operationId: checkIsinsInGdp
      parameters:
        - $ref: './shared-resources/common-isins.yaml#/components/parameters/isinsInPathRequiredWithPattern'
      responses:
        '200':
          description: returns  list of fivfi ids of the isin, if were found in the GDP
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Invalid isins
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActions/isinSanctions/{isin}:
    get:
      tags:
        - GDP
      summary: Get ISIN sanctions
      description: Returns sanctions defined in GDP for specified ISIN - returns only sanctions currently in place.
      operationId: getIsinSanctions
      parameters:
        - $ref: './shared-resources/common-isins.yaml#/components/parameters/isinInPathRequiredWithPattern'
      responses:
        '200':
          description: Returns active sanctions for given ISIN
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IsinSanction'
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActions/isin/{spaId}:
    get:
      tags:
        - Corporate Action
      summary: Get CA ISIN
      description: Returns ISIN of Corporate Action specified by given spa ID
      operationId: getIsin
      parameters:
        - name: spaId
          in: path
          required: true
          example: 1234
          description: ID of Corporate Action
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Returns ISIN of CA
          content:
            text/plain:
              schema:
                type: string
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActions/getActualZspa/{spaId}:
    get:
      tags:
        - Corporate Action
      description: Get the information about corporate actions
      operationId: getActualZspa
      parameters:
        - name: spaId
          in: path
          required: true
          example: 12345
          description: Corporate action identification
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: return the last active zspa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Canzspa'
        '204':
          description: isin not found in the database no string will be returned
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Invalid isin
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActions/getSpaZspaPairs:
    get:
      tags:
        - Corporate Action
      description: Get current zspaId paired to spaId from given spaId list
      operationId: getSpaZspaPairs
      parameters:
        - name: spaIds
          in: query
          required: true
          schema:
            type: array
            items:
              type: integer
              format: int64
      responses:
        '200':
          description: return the last active zspa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpaZspaPair'
        '204':
          description: isin not found in the database no string will be returned
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Invalid isin
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActions/orderHead/{spaId}:
    get:
      tags:
        - Corporate Action Data
      description: Get the information about corporate actions for customer instructions
      operationId: orderHead
      parameters:
        - name: spaId
          in: path
          required: true
          example: 12345
          description: Corporate action identification
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: returns fivfi id of the isin, is was found in the GDP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderHead'
        '204':
          description: isin not found in the database no string will be returned
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Invalid isin
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActions/history/{spaId}:
    get:
      tags:
        - Corporate Action
      summary: Returns corporate actions history (canzspa_log)
      description: Returns corporate actions history (canzspa_log)
      operationId: getEventHistory
      parameters:
        - name: spaId
          in: path
          required: true
          example: 1111
          description: Can event id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorporateActionHistory'
        '400':
          description: Invalid status value
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActions/geos-reconciliation-status:
    get:
      tags:
        - Corporate Action
      description: GEOS event reconciliation status
      operationId: getGeosEventReconciliationStatuses
      parameters:
        - $ref: './shared-resources/common-zspaIds.yaml#/components/parameters/zspaIdInQueryRequired'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CorporateActionGEOSReconciliationStatus'
        '400':
          description: Invalid status value
      security:
        - can_auth:
          - 'CAN-CA_V'
  /corporateActions/getById/{zspaId}:
    get:
      tags:
        - Corporate Action
      summary: Gets corporate action by zspaId
      description: Returns existing corporate actions by zspa id or 404
      operationId: getById
      parameters:
        - $ref: './shared-resources/common-zspaIds.yaml#/components/parameters/zspaIdInPathRequired'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchCanInstanceResult'
        '404':
          description: Not found
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActions/lagetstellen/{spaId}:
    get:
      tags:
        - Corporate Action
      summary: Gets list of laggestellen selected in corporate action by spaId
      description: Returns list of laggestellen by spa id or 404
      operationId: getLagetstellenBySpaId
      parameters:
        - name: spaId
          in: path
          required: true
          example: 1111
          description: Can event id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LagerstelleType'
        '404':
          description: Not found
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActionsData/options/{spaId}:
    get:
      tags:
        - Corporate Action Data
      description: Gets the default option code from a ca schema
      operationId: options
      parameters:
        - name: spaId
          in: path
          required: true
          example: 12345
          description: Corporate action identification
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: return available options from the schema for the event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Option'
        '400':
          description: Invalid event
      security:
        - can_auth:
            - 'CAN-CA_V'
            - 'GIG_API'
  /corporateActionsData/defaultOption/{spaId}:
    get:
      tags:
        - Corporate Action Data
      description: Gets the default option code from a ca schema
      operationId: defaultOption
      parameters:
        - name: spaId
          in: path
          required: true
          example: 12345
          description: Corporate action identification
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: return default option from the schema for the event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptionId'
        '400':
          description: Invalid event
      security:
        - can_auth:
            - 'CAN-CA_V'
            - 'GIG_API'
  /corporateActionsData/corpRef/{zspaId}:
    get:
      tags:
        - Corporate Action Data
      description: >-
        Get corporate action corp ref
      operationId: corpRef
      parameters:
        - $ref: './shared-resources/common-zspaIds.yaml#/components/parameters/zspaIdInPathRequired'
      responses:
        '200':
          description: return zspa's corp ref
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Invalid event
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActionsData/dueDate/{zspaId}:
    get:
      tags:
        - Corporate Action Data
      description: >-
        Get corporate action due date from event data.
        Block (OSCA),
        Tags (98a, 98C)
        Value source - (XDTE, EFFD , RDTE) or TODAY
        The value is take by priority from sq XDTE, EFFD, RDTE if non of those are set TODAY is taken
      operationId: dueDate
      parameters:
        - $ref: './shared-resources/common-zspaIds.yaml#/components/parameters/zspaIdInPathRequired'
      responses:
        '200':
          description: return default option from the schema for the event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DueDate'
        '400':
          description: Invalid event
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActionsData/canspaAttrValue:
    get:
      tags:
        - Corporate Action Data
      description: Corporate action non swift attributes assigned to zspa
      operationId: getCanspaAttrvalueMap
      parameters:
        - name: spaId
          in: query
          example: W
          description: W(Writting) F(Generated not printed) E(Error) P(Printed) R(Done) N(No report) I(Ignored due to duplicities)
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
                additionalProperties:
                  type: string
        '400':
          description: Invalid status value
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActionsData/canspaAttrValues:
    get:
      tags:
        - Corporate Action Data
      description: Corporate action non swift attributes by corpRef
      operationId: getCanspaAttrValueMapByCorpRef
      parameters:
        - $ref: './shared-resources/common.yaml#/components/parameters/corpRef'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
                additionalProperties:
                  type: string
        '400':
          description: Invalid status value
      security:
        - can_auth:
            - 'CAN-CA_V'
  /corporateActionsData/details:
    get:
      tags:
        - Corporate Action Data
      summary: Get corporate action details
      description: Get corporate action details by CA ID (spaId)
      operationId: getCorporateActionDetails
      parameters:
        - name: spaId
          in: query
          required: true
          example: 1111
          description: Can spa event id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorporateActionDetails'
        '404':
          description: Not found
      security:
        - can_auth:
            - 'CAN-CA_V'
    put:
      tags:
        - Corporate Action Data
      summary: Update corporate action
      description: Update corporate action details
      operationId: updateCorporateActionDetails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorporateActionDetails'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorporateActionDetails'
      security:
        - can_auth:
            - 'CAN-CA_E' # TOCheck
    post:
      tags:
        - Corporate Action Data
      summary: Create corporate action
      description: Create corporate action
      operationId: createCorporateActionDetails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorporateActionDetails'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorporateActionDetails'
      security:
        - can_auth:
            - 'CAN-CA_E' # TOCheck
  /corporateActionsData/canvlus:
    get:
      tags:
        - Corporate Action Data
      summary: Get canvlus for the corporate action
      description: Get corporate action details by zspaId
      operationId: getCanvlus
      parameters:
        - $ref: './shared-resources/common-zspaIds.yaml#/components/parameters/zspaIdInQueryRequired'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Canvlu'
        '404':
          description: Not found
      security:
        - can_auth:
            - 'CAN-CA_V'
