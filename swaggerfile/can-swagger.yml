components:
  securitySchemes:
    can_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: 'https://rzbtomt01.at.rzb.rbg.cc/cantest/login'
          scopes:
            #CORPORATE ACTIONS
            'CAN-DEV_V': CAN Corporate Action - development feature - view
            'CAN-CA_V': CAN Corporate Action - view
            'CAN-CA_E': CAN Corporate Action - edit
            'CAN-CA_SW': CAN Corporate Action - send
            'CAN-GSS_GO': CAN Corporate Action - send
            #VIP KUNDEN
            'CAN-PK_V': CAN VIP-Kunden - view
            'CAN-PK_E': CAN VIP-Kunden - edit
            'CAN-VK_V': CAN VIP-KundenwÃ¼nsche - view
            'CAN-VK_E': CAN VIP-KundenwÃ¼nsche - edit
            #ELLA
            'CAN-ELLA_T': CAN ELLA Schematransfer
            'CAN-ELLA_E': CAN ELLA
            'CAN-ELLA_V': CAN ELLA View
            #WAC
            'CAN-WAC_V': CAN Maintenance screen view
            'CAN-WAC_E': CAN Maintenance screen edit
            #TODOroles
            'CAN-TD_E': CAN TODO edit
            'CAN-TD_V': CAN TODO view
            # GIG API Roles
            'GIG_API': GIG API permission
    api_key:
      type: apiKey
      name: api_key
      in: header
  #-------------------------------
  # Reusable operation parameters
  #-------------------------------
  #@QueryParam("sort") String sort,
  #@Pattern(regexp ="\\b(?:asc|desc)\\b") @QueryParam("order") String order,
  #@QueryParam("page") Integer page,
  #@QueryParam("pageSize") Integer pageSize

  parameters:
    zspaStatus:
      name: zspaStatus
      in: query
      example: E
      description: Event zspa status - Alle (all), Erfasst (E), Freigegeben (F), Versendet (V)
      schema:
        $ref: '#/components/schemas/ZspaStatus'
    zspaWfStatus:
      name: zspaWfStatus
      in: query
      example: DONE
      description: Current workflow status of an event
      schema:
        $ref: '#/components/schemas/ZspaWfStatus'
    spaCanstat:
      name: spaCanstat
      in: query
      example: ADV
      description: Reflecting stage in the workflow - All (all), Preadvice (PRE), Advice (ADV), Reminder (REM)
      schema:
        $ref: '#/components/schemas/SpaCanStatus'
    spaStatus:
      name: spaStatus
      in: query
      example: rddt_date
      description: Event spa status - Active (A), Deleted (G)
      schema:
        $ref: '#/components/schemas/ActiveStatus'
    nsdResponseStatus:
      name: nsdResponseStatus
      in: query
      description: property to filter the records with disclosures that have a certain response from NSD
      schema:
        $ref: '#/components/schemas/NsdResponseStatus'

    caFromDate:
      name: caFromDate
      in: query
      example: 2017-07-21
      description: Can event spa date - creation date of the event
      schema:
        type: string
        format: date
    caToDate:
      name: caToDate
      in: query
      example: 2017-07-21
      description: Can event spa date- creation date of the event
      schema:
        type: string
        format: date
    canSpaAttrs: #deepObject https://swagger.io/docs/specification/serialization/ /users?id[role]=admin&id[firstName]=Alex
      name: canSpaAttrs
      in: query
      example: 2017-07-21
      description: Can event spa date- creation date of the event
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SearchByCanspaAttrType'

  #-------------------------------
  # Reusable schemas (data models)
  #-------------------------------
  schemas:
    SpaCanStatus: # '#/components/schemas/SpaCanStatus'
      type: string
      description: Reflecting stage in the workflow - Preadvice (PRE), Advice (ADV), Reminder (REM)
      enum:
        - PRE
        - ADV
        - REM
    ActiveStatus:
      type: string
      enum:
        - A
        - G
      description:
        A - Active
        G - Deleted
      example: A
    NsdResponseStatus:
      type: string
      description: Reflecting what should be the positiveNsdResponse value from the disclosure
      enum:
        - COMPLETE
        - INCOMPLETE
        - INCOMPLETE_LATE
        - NO_RESPONSE
      example: INCOMPLETE
    ZspaStatus:
      type: string
      description: Event zspa status - Erfasst (E), Freigegeben (F), Versendet (V)
      enum:
        - E
        - F
        - V
    ZspaSendStatus:
      type: string
      enum:
        - GDP
        - GOL
      description:
        GDP - GEOS daten pool
        GOL - GEOS online
    ZspaWfStatus:
      type: string
      description: Event
      enum:
        - EVENT_CREATED
        - INPUT_NEEDED
        - TRANSLATION_NEEDED
        - READY_FOR_RELEASE
        - FOR_CORRECTION
        - SEND_SERIAL_LETTER
        - AWAIT_EVENT_UPDATE
        - DONE
        - NOTIFICATION_DONE
        - DELETED
    AgentDisclosureStatus:
      type: string
      description: ERROR = 'E' COMPLETED = 'C' UPLOADED = 'U' NOT STARTED = 'N' CLOSED NO PROCESSING 'W'
      enum:
        - N
        - U
        - E
        - C
        - W
    SearchByCanspaAttrType:
      title: Search by can spa attribute type
      description: Holds key value pair to filter by canspa attributes
      type: object
      required:
        - spaattrdefId
      properties:
        spaattrdefId:
          type: integer
          format: int64
          description: Attribute definition. Reffers to a definition in db - Attribute, name, mandatory, attribute type (select/text etc), default value and the linkage to event type
          example: 1
        spaattrValue:
          type: string
          maxLength: 255
          description: String value of canspaattr for a given definition
          example: RU TAX
    CanspaAttr:
      title: Attribute values used in Corporate actions details
      description: Hold attribute values for a specific event
      type: object
      properties:
        spaattrId:
          type: integer
          format: int64
          description: Id
        spaId:
          type: integer
          format: int64
          description: Can event identification
        spaattrdefName:
          type: string
          description: Attribute definition name.
          example: 1
        spaattrdefId:
          type: integer
          format: int64
          description: Attribute definition. Reffers to a definition in db - Attribute, name, mandatory, attribute type (select/text etc), default value and the linkage to event type
          example: 1
        spaattrValue:
          type: string
          description: String value of canspaattr for a given definition
          example: RU TAX
        definitionIdentifier:
          type: string
          description: Unique identifier of the definition
          example: AGENT_EMAIL
    SearchCanInstanceResult:
      title: Can instance search result bean
      description: Can event data filtered according search criteria
      type: object
      properties:
        cantypId:
          type: integer
          format: int64
          description: Corporate action template type
        spaId:
          type: integer
          format: int64
          description: Can event identification
        zspaId:
          $ref: './shared-resources/common-zspaIds.yaml#/components/schemas/ZspaIdSchema'
        isinIdent:
          type: string
          description: Can event ISIN
        corpRef:
          type: string
          description: CAN Corporate action unique ID
        coaf:
          type: string
        bezeichnung:
          type: string
        cantypBez:
          type: string
        duplicationProhibitedBefore:
          type: string
          format: date
        spaDatum:
          type: string
          format: date
        spaLoeschbar:
          type: boolean
        spaStatus:
          $ref: '#/components/schemas/ActiveStatus'
          description: status of the corporat action active/inactive
        spaCaRef:
          type: string
        zspaStatus:
          $ref: '#/components/schemas/ZspaStatus'
        deletable:
          type: boolean
        spaCanstat:
          $ref: '#/components/schemas/SpaCanStatus'
          description: Reflecting stage in the workflow - All (all), Preadvice (PRE), Advice (ADV), Reminder (REM)
        zspaKzSende:
          type: string
          enum:
            - GDP
            - GOL
          description:
            GDP - GEOS daten pool
            GOL - GEOS online
          example: GDP
        zspaKzPre:
          $ref: './shared-resources/common.yaml#/components/schemas/YesNoStatus'
        zspaDatumSend:
          type: string
          format: date
          description: Letzte Freigabe
        zspaDatumGol:
          type: string
          format: date
          description: GOL-Stichtag
        canlgs:
          type: array
          items:
            $ref: './shared-resources/common.yaml#/components/schemas/SearchLagerstelleType'
          description: Lagerstellen
        canattrs:
          type: array
          items:
            $ref: '#/components/schemas/CanspaAttr'
        vluWert:
          type: string
          description: 23G
        rddtVal:
          type: string
          example: 20211027100000
        rdteVal:
          type: string
          example: 20211027100000
        zspaDatumAdv:
          type: string
          format: date
        cantypStatus:
          $ref: '#/components/schemas/ActiveStatus'
        zspaKzToIss:
          $ref: './shared-resources/common.yaml#/components/schemas/YesNoStatus'
        zspaWfStatus:
          $ref: '#/components/schemas/ZspaWfStatus'
        zspaSlettersWasSent:
          $ref: './shared-resources/common.yaml#/components/schemas/YesNoStatus'
        agentDisclosureStatus:
          $ref: '#/components/schemas/AgentDisclosureStatus'
        agentDisclosureStdiProcessed:
