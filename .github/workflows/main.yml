name: API Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  workflow_dispatch:  # Allow manual trigger

env:
  NODE_VERSION: '18.x'
  TEST_ENV: 'test'  # Default to test environment

jobs:
  test:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        test-group: [search, details, history, management, error-scenarios]
      fail-fast: false  # Continue with other tests even if one fails

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright
      run: npx playwright install --with-deps

    - name: Run Tests
      env:
        # Add your secrets here
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        API_USERNAME: ${{ secrets.API_USERNAME }}
        API_PASSWORD: ${{ secrets.API_PASSWORD }}
        API_TOKEN: ${{ secrets.API_TOKEN }}
      run: |
        npm test tests/corporate-actions/${{ matrix.test-group }}.spec.ts

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.test-group }}
        path: |
          playwright-report/
          test-results/
        retention-days: 30

  report:
    name: Generate Test Report
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: Download Test Results
      uses: actions/download-artifact@v3
      with:
        path: test-results

    - name: Publish Test Report
      uses: dorny/test-reporter@v1
      with:
        name: API Test Results
        path: 'test-results/**/junit.xml'
        reporter: jest-junit
        fail-on-error: false
